<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAV → Sheet Music</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="top-bar">
      <h1>WAV → Sheet Music</h1>
      <input type="file" id="fileInput" accept=".json" hidden>
      <div class="hint">Drop a notes.json &middot; <a id="clickHint">choose file</a></div>
    </div>

    <div class="info-bar" id="infoBar" style="display:none">
      <span><span class="label">Notes:</span> <span class="val" id="infoNotes">0</span></span>
      <span><span class="label">Tempo:</span> <span class="val" id="infoTempo">0</span> BPM</span>
      <span><span class="label">Duration:</span> <span class="val" id="infoDuration">0</span>s</span>
      <span><span class="label">Key:</span> <span class="val" id="infoKey">C</span></span>
      <span><span class="label">Time:</span> <span class="val" id="infoTime">4/4</span></span>
      <span><span class="label">Measures:</span> <span class="val" id="infoMeasures">0</span></span>
    </div>

    <div id="status"></div>

    <div class="sheet-area">
      <div id="paper"></div>
    </div>

    <div id="abcRaw"></div>
    <span class="abc-toggle" id="abcToggle" style="display:none">&#9660; Show raw ABC</span>

    <div class="bottom-bar" id="bottomBar">
      <button id="playBtn">&#9654; Play</button>
      <button id="stopBtn">&#9632; Stop</button>
      <progress id="progress" value="0" max="100"></progress>
      <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.4/dist/abcjs-basic-min.js"></script>
  <script src="app.js"></script>
</body>
</html>
