<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAV → Sheet Music</title>
  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.4/dist/abcjs-basic-min.js">
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0b0e;
      color: #d4d4dc;
      font-family: -apple-system, system-ui, sans-serif;
      min-height: 100vh;
    }
    .app { min-height: 100vh; display: flex; flex-direction: column; }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.9rem 1.5rem;
      border-bottom: 1px solid #1e1e28;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .top-bar h1 {
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #6b6b78;
    }
    .top-bar .hint {
      font-size: 0.75rem;
      color: #3a3a48;
      margin-left: auto;
    }
    .top-bar .hint a {
      color: #3a3a48;
      text-decoration: underline;
      cursor: pointer;
    }
    .top-bar .hint a:hover { color: #6b6b78; }

    .info-bar {
      display: flex;
      gap: 1.5rem;
      padding: 0.6rem 1.5rem;
      font-size: 0.78rem;
      color: #6b6b78;
      border-bottom: 1px solid #1e1e28;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .info-bar .label { color: #3a3a48; }
    .info-bar .val { color: #d4d4dc; font-weight: 500; font-variant-numeric: tabular-nums; }

    #status {
      padding: 0.4rem 1.5rem;
      font-size: 0.75rem;
      color: #3a3a48;
      flex-shrink: 0;
      min-height: 0.5rem;
    }
    #status.error { color: #f87171; }
    #status.ok { color: #4ade80; }

    .sheet-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative;
    }
    #paper {
      flex: 1;
      background: #fff;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow: auto;
    }
    #paper svg { display: block; }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1rem;
      color: #6b6b78;
    }
    .empty-state h2 { font-size: 1.1rem; font-weight: 400; margin-bottom: 0.3rem; }
    .empty-state p { font-size: 0.8rem; color: #3a3a48; }

    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 4rem;
      color: #6b6b78;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid #e0e0e0;
      border-top-color: #6d28d9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 0.8rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .drop-zone {
      border: 2px dashed #2a2a38;
      border-radius: 10px;
      padding: 1.5rem 2rem;
      text-align: center;
      cursor: pointer;
      margin: 1rem;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .drop-zone:hover { border-color: #6b6b78; }
    .drop-zone.has-data { border-color: #6d28d9; background: rgba(109,40,217,0.06); }
    .drop-zone .icon { font-size: 2rem; color: #3a3a48; margin-bottom: 0.3rem; }
    .drop-zone .title { font-size: 0.85rem; color: #6b6b78; }
    .drop-zone .fname { font-size: 0.8rem; color: #6d28d9; margin-top: 0.3rem; }

    .bottom-bar {
      display: none;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 1.5rem;
      border-top: 1px solid #1e1e28;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .bottom-bar.visible { display: flex; }
    .bottom-bar button {
      background: #1e1e28;
      border: none;
      color: #d4d4dc;
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      min-width: 60px;
    }
    .bottom-bar button:hover { background: #6d28d9; color: #fff; }
    .bottom-bar button:disabled { opacity: 0.35; cursor: default; }
    .bottom-bar progress {
      -webkit-appearance: none;
      appearance: none;
      width: 200px;
      height: 4px;
      border-radius: 2px;
    }
    .bottom-bar progress::-webkit-progress-bar { background: #1e1e28; border-radius: 2px; }
    .bottom-bar progress::-webkit-progress-value { background: #6d28d9; border-radius: 2px; }
    .bottom-bar .time-display {
      font-size: 0.75rem;
      color: #6b6b78;
      font-variant-numeric: tabular-nums;
    }

    .abc-toggle {
      font-size: 0.7rem;
      color: #3a3a48;
      cursor: pointer;
      margin-left: auto;
    }
    .abc-toggle:hover { color: #6b6b78; }
    #abcRaw {
      display: none;
      background: #131318;
      padding: 0.8rem 1.5rem;
      font-family: 'SF Mono', 'Menlo', monospace;
      font-size: 0.72rem;
      color: #6b6b78;
      white-space: pre-wrap;
      max-height: 150px;
      overflow: auto;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-bar">
      <h1>WAV → Sheet Music</h1>
      <input type="file" id="fileInput" accept=".json" hidden>
      <div class="hint" id="dropHint">Drop a notes.json &middot; <a id="clickHint">choose file</a></div>
    </div>

    <div class="drop-zone" id="dropZone">
      <div class="icon">&#9835;</div>
      <div class="title">Drop a notes.json here</div>
      <div class="fname" id="fileName"></div>
    </div>

    <div class="info-bar" id="infoBar" style="display:none">
      <span><span class="label">Notes:</span> <span class="val" id="infoNotes">0</span></span>
      <span><span class="label">Tempo:</span> <span class="val" id="infoTempo">0</span> BPM</span>
      <span><span class="label">Duration:</span> <span class="val" id="infoDuration">0</span>s</span>
      <span><span class="label">Key:</span> <span class="val" id="infoKey">C</span></span>
      <span><span class="label">Time:</span> <span class="val" id="infoTime">4/4</span></span>
      <span><span class="label">Measures:</span> <span class="val" id="infoMeasures">0</span></span>
    </div>

    <div id="status"></div>

    <div class="sheet-area">
      <div id="paper"></div>
    </div>

    <div id="abcRaw"></div>
    <span class="abc-toggle" id="abcToggle" style="display:none">&#9660; Show raw ABC</span>

    <div class="bottom-bar" id="bottomBar">
      <button id="playBtn">&#9654; Play</button>
      <button id="stopBtn">&#9632; Stop</button>
      <progress id="progress" value="0" max="100"></progress>
      <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
    </div>
  </div>

  <script>
    // ══════════════════════════════════════════════════════════════════════
    // ABC NOTE UTILITIES
    // ══════════════════════════════════════════════════════════════════════

    const NATURAL_PC_TO_LETTER = {
      0: 'C', 2: 'D', 4: 'E', 5: 'F', 7: 'G', 9: 'A', 11: 'B',
    };
    const LETTER_TO_PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

    // Sharp order (F C G D A E B) and flat order (B E A D G C F) as LETTER NAMES
    const SHARP_LETTERS = ['F', 'C', 'G', 'D', 'A', 'E', 'B'];
    const FLAT_LETTERS = ['B', 'E', 'A', 'D', 'G', 'C', 'F'];

    const KEY_NAMES = {
      [-6]: 'Gb', [-5]: 'Db', [-4]: 'Ab', [-3]: 'Eb', [-2]: 'Bb', [-1]: 'F',
      0: 'C', 1: 'G', 2: 'D', 3: 'A', 4: 'E', 5: 'B', 6: 'F#',
    };

    // Black key options: prefer sharp (letterC + ^) vs flat (letterD + _)
    const BLACK_KEY_SHARP = { 1: 'C', 3: 'D', 6: 'F', 8: 'G', 10: 'A' };
    const BLACK_KEY_FLAT  = { 1: 'D', 3: 'E', 6: 'G', 8: 'A', 10: 'B' };

    function getAlteredLetters(keySig) {
      // Returns set of letter names altered by this key signature
      // e.g. { F: '#', C: '#', G: '#' } for A major (3 sharps)
      const set = {};
      if (keySig > 0) {
        for (let i = 0; i < Math.min(keySig, 7); i++) set[SHARP_LETTERS[i]] = '#';
      } else if (keySig < 0) {
        for (let i = 0; i < Math.min(-keySig, 7); i++) set[FLAT_LETTERS[i]] = 'b';
      }
      return set;
    }

    function pcToLetter(pc, keySig) {
      // Returns ABC note name (letter + accidental prefix) for a MIDI pitch class
      const altered = getAlteredLetters(keySig);

      // Natural white key?
      if (pc in NATURAL_PC_TO_LETTER) {
        const letter = NATURAL_PC_TO_LETTER[pc];
        if (altered[letter]) return '=' + letter; // key sig would alter this → natural sign
        return letter;
      }

      // Black key — pick sharp or flat
      const sharpLetter = BLACK_KEY_SHARP[pc];
      const flatLetter = BLACK_KEY_FLAT[pc];

      if (keySig >= 0) {
        // Prefer sharp
        if (altered[sharpLetter]) return sharpLetter; // key sig already handles it
        return '^' + sharpLetter;
      } else {
        // Prefer flat
        if (altered[flatLetter]) return flatLetter;
        return '_' + flatLetter;
      }
    }

    function midiToABC(midiPitch, keySig) {
      const pc = midiPitch % 12;
      const octave = Math.floor(midiPitch / 12) - 1;

      const name = pcToLetter(pc, keySig);
      const letter = name.replace(/^[=_^]/, '');
      const acc = name.length > 1 ? name[0] : '';

      let result;
      if (octave <= 3) {
        result = acc + letter + ','.repeat(4 - octave);
      } else if (octave === 4) {
        result = acc + letter;
      } else {
        result = acc + letter.toLowerCase() + "'".repeat(octave - 5);
      }
      return result;
    }

    function noteABC(pitch, grids, keySig) {
      const n = midiToABC(pitch, keySig);
      return grids > 1 ? n + grids : n;
    }

    function restABC(grids) {
      return grids > 1 ? 'z' + grids : 'z';
    }

    function chordABC(pitches, grids, keySig) {
      if (pitches.length === 0) return restABC(grids);
      if (pitches.length === 1) return noteABC(pitches[0], grids, keySig);
      const notes = pitches.map(p => midiToABC(p, keySig)).join('');
      return '[' + notes + ']' + (grids > 1 ? grids : '');
    }

    // ══════════════════════════════════════════════════════════════════════
    // ABC GENERATION
    // ══════════════════════════════════════════════════════════════════════

    function generateABC(data) {
      const { notes, tempo, timeSignature, keySignature } = data;
      if (!notes || notes.length === 0) return null;

      const beatsPerMeasure = timeSignature[0] || 4;
      const beatUnit = timeSignature[1] || 4;
      const keySig = keySignature || 0;
      const bpm = tempo || 120;
      const gridSec = (60 / bpm) / 4; // 16th note grid

      // Quantize note events to 16th-note grid
      const gNotes = [];
      for (const n of notes) {
        const sg = Math.round(n.startTime / gridSec);
        let eg = Math.round((n.startTime + n.duration) / gridSec);
        if (eg <= sg) eg = sg + 1;
        gNotes.push({ p: n.pitch, sg, eg });
      }
      if (gNotes.length === 0) return null;

      const totalGrids = Math.max(...gNotes.map(n => n.eg)) + 1;

      // Find pitch-set changes per grid tick
      const events = [];
      let prev = new Set();
      for (let g = 0; g < totalGrids; g++) {
        const active = new Set();
        for (const n of gNotes) {
          if (n.sg <= g && n.eg > g) active.add(n.p);
        }
        if (g === 0 || !setsEqual(active, prev)) {
          events.push({ g, pitches: [...active].sort((a, b) => a - b) });
        }
        prev = active;
      }

      // Assign durations (in grid ticks)
      for (let i = 0; i < events.length; i++) {
        const next = i < events.length - 1 ? events[i + 1].g : totalGrids;
        events[i].dur = next - events[i].g;
      }

      const gpm = beatsPerMeasure * 4; // grids per measure (16 per 4/4 measure)

      // Split events across measure boundaries (for ties)
      const measures = [];
      let cur = [];
      let curEnd = gpm;

      for (const ev of events) {
        let rem = ev.dur;
        let off = ev.g;
        while (rem > 0) {
          const inCur = Math.min(rem, curEnd - off);
          if (inCur > 0) cur.push({ p: ev.pitches, d: inCur });
          rem -= inCur;
          off += inCur;
          if (off >= curEnd) {
            if (cur.length > 0) measures.push(cur);
            cur = [];
            curEnd += gpm;
          }
        }
      }
      if (cur.length > 0) measures.push(cur);
      if (measures.length === 0) return null;

      const keyName = KEY_NAMES[keySig] || 'C';

      const abcMeasures = measures.map((meas, mi) => {
        const isLast = mi === measures.length - 1;
        let s = '';
        for (const ev of meas) {
          if (s.length) s += ' ';
          s += ev.p.length === 0
            ? restABC(ev.d)
            : chordABC(ev.p, ev.d, keySig);
        }
        const total = meas.reduce((sum, e) => sum + e.d, 0);
        const fill = gpm - total;
        if (fill > 0 && !isLast) {
          if (s.length) s += ' ';
          s += restABC(fill);
        }
        return s + (isLast ? '|]' : ' |');
      });

      return [
        'X:1',
        'M:' + beatsPerMeasure + '/' + beatUnit,
        'L:1/16',
        'Q:1/4=' + bpm,
        'K:' + keyName,
        '',
        abcMeasures.join('\n'),
      ].join('\n');
    }

    function setsEqual(a, b) {
      if (a.size !== b.size) return false;
      for (const v of a) if (!b.has(v)) return false;
      return true;
    }

    // ══════════════════════════════════════════════════════════════════════
    // RENDERING
    // ══════════════════════════════════════════════════════════════════════

    const $ = id => document.getElementById(id);
    const paper = $('paper');
    const dropZone = $('dropZone');
    const fileInput = $('fileInput');
    const fileName = $('fileName');
    const statusEl = $('status');
    const infoBar = $('infoBar');
    const abcRaw = $('abcRaw');
    const abcToggle = $('abcToggle');
    const bottomBar = $('bottomBar');

    let currentData = null;
    let currentABC = null;

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = type || '';
    }

    // File input
    dropZone.addEventListener('click', () => fileInput.click());
    $('clickHint').addEventListener('click', (e) => { e.stopPropagation(); fileInput.click(); });
    dropZone.addEventListener('dragover', e => e.preventDefault());
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      const f = e.dataTransfer.files[0];
      if (f && f.name.endsWith('.json')) loadJSON(f);
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) loadJSON(fileInput.files[0]);
    });

    initEmptyState();

    function initEmptyState() {
      paper.innerHTML =
        '<div class="empty-state"><h2>No data loaded</h2><p>Drop a notes.json file to generate sheet music</p></div>';
    }

    function loadJSON(file) {
      fileName.textContent = file.name;
      dropZone.classList.add('has-data');
      setStatus('Loading...');
      paper.innerHTML =
        '<div class="loading"><div class="spinner"></div><span>Transcribing notes...</span></div>';

      const reader = new FileReader();
      reader.onload = e => {
        try {
          processData(JSON.parse(e.target.result));
        } catch (err) {
          setStatus('Parse error: ' + err.message, 'error');
          initEmptyState();
        }
      };
      reader.onerror = () => {
        setStatus('Failed to read file', 'error');
        initEmptyState();
      };
      reader.readAsText(file);
    }

    function processData(data) {
      currentData = data;
      const notes = data.notes || [];

      if (!notes.length) {
        setStatus('No notes in this file', 'error');
        paper.innerHTML =
          '<div class="empty-state"><h2>No notes detected</h2><p>The transcription found nothing.</p></div>';
        infoBar.style.display = 'none';
        abcToggle.style.display = 'none';
        bottomBar.classList.remove('visible');
        return;
      }

      const keyName = KEY_NAMES[(data.keySignature || 0)] || 'C';
      $('infoNotes').textContent = notes.length;
      $('infoTempo').textContent = data.tempo || '?';
      $('infoDuration').textContent = (data.duration || 0).toFixed(1);
      $('infoKey').textContent = keyName;
      $('infoTime').textContent = (data.timeSignature || [4, 4]).join('/');
      infoBar.style.display = 'flex';

      setStatus('Generating notation...');

      setTimeout(() => {
        try {
          const abc = generateABC(data);
          if (!abc) throw new Error('ABC generation returned null');

          currentABC = abc;
          abcRaw.textContent = abc;
          abcToggle.style.display = 'inline-block';
          abcToggle.innerHTML = '&#9660; Show raw ABC';

          setStatus('Rendering...');
          renderABC(abc, data);
        } catch (err) {
          setStatus('Error: ' + err.message, 'error');
          paper.innerHTML =
            '<div class="empty-state"><h2>Generation failed</h2><p>' + err.message + '</p></div>';
        }
      }, 30);
    }

    function renderABC(abc, data) {
      paper.innerHTML = '';
      bottomBar.classList.remove('visible');

      try {
        const visualObjs = ABCJS.renderAbc('paper', abc, {
          responsive: 'resize',
          add_classes: true,
          paddingleft: 20,
          paddingright: 20,
          paddingtop: 20,
          paddingbottom: 20,
        });

        if (!visualObjs || visualObjs.length === 0) {
          throw new Error('abcjs returned no output');
        }

        const vis = visualObjs[0];
        const measureCount = vis.lines
          ? vis.lines.reduce((s, l) => s + (l.staff ? l.staff.length : 0), 0)
          : '?';
        $('infoMeasures').textContent = measureCount;

        setupPlayback(data);
        setStatus('Ready — ' + data.notes.length + ' notes, ' + measureCount + ' measures', 'ok');
      } catch (err) {
        console.error('Render error:', err);
        paper.innerHTML =
          '<div class="empty-state"><h2>Render failed</h2><p>' + err.message + '</p></div>';
        setStatus('Render error', 'error');
      }
    }

    // ══════════════════════════════════════════════════════════════════════
    // PLAYBACK — from our own note data, not abcjs MIDI
    // ══════════════════════════════════════════════════════════════════════

    let audioCtx = null;
    let playEvents = [];
    let isPlaying = false;
    let resumeOffset = 0;
    let playStart = 0;
    let totalDur = 0;
    let progressRAF = null;
    let stopTimer = null;

    function setupPlayback(data) {
      try {
        const bpm = data.tempo || 120;
        const notes = data.notes || [];

        playEvents = notes.map(n => ({
          t: n.startTime,
          dur: Math.max(n.duration, 0.1),
          p: n.pitch,
          v: Math.min(Math.round((n.velocity || 80) / 127 * 127), 127),
        }));
        playEvents.sort((a, b) => a.t - b.t);

        if (playEvents.length === 0) return;

        totalDur = data.duration || 0;
        if (totalDur <= 0) {
          totalDur = Math.max(...playEvents.map(e => e.t + e.dur));
        }

        bottomBar.classList.add('visible');
        $('playBtn').textContent = '▶ Play';
        $('playBtn').disabled = false;
        $('stopBtn').disabled = true;
        $('progress').value = 0;
        $('timeDisplay').textContent = '0:00 / ' + fmtTime(totalDur);
      } catch (err) {
        console.error('Playback setup error:', err);
      }
    }

    $('playBtn').addEventListener('click', async () => {
      if (isPlaying) {
        isPlaying = false;
        resumeOffset += audioCtx.currentTime - playStart;
        $('playBtn').textContent = '▶ Resume';
        if (stopTimer) { clearTimeout(stopTimer); stopTimer = null; }
        if (progressRAF) { cancelAnimationFrame(progressRAF); progressRAF = null; }
        return;
      }

      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();

      playStart = audioCtx.currentTime;
      isPlaying = true;
      $('playBtn').textContent = '■ Pause';
      $('stopBtn').disabled = false;

      for (const ev of playEvents) {
        const start = ev.t - resumeOffset;
        if (start < 0) continue;
        scheduleNote(ev.p, start, ev.dur, ev.v);
      }

      const remaining = totalDur - resumeOffset;
      if (remaining > 0) {
        stopTimer = setTimeout(stopPlayback, remaining * 1000 + 300);
      }

      function tick() {
        if (!isPlaying) return;
        const elapsed = resumeOffset + audioCtx.currentTime - playStart;
        const pct = Math.min(100, (elapsed / totalDur) * 100);
        $('progress').value = pct;
        $('timeDisplay').textContent = fmtTime(elapsed) + ' / ' + fmtTime(totalDur);
        if (pct < 100) progressRAF = requestAnimationFrame(tick);
        else stopPlayback();
      }
      progressRAF = requestAnimationFrame(tick);
    });

    function scheduleNote(pitch, t, dur, vel) {
      if (!audioCtx) return;
      const freq = 440 * Math.pow(2, (pitch - 69) / 12);
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const vol = (vel / 127) * 0.2;
      const now = audioCtx.currentTime;
      const absT = now + Math.max(0, t);
      gain.gain.setValueAtTime(0, absT);
      gain.gain.linearRampToValueAtTime(vol, absT + 0.008);
      gain.gain.setValueAtTime(vol, absT + dur - 0.04);
      gain.gain.linearRampToValueAtTime(0, absT + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(absT);
      osc.stop(absT + dur + 0.05);
    }

    function stopPlayback() {
      isPlaying = false;
      resumeOffset = 0;
      $('playBtn').textContent = '▶ Play';
      $('playBtn').disabled = false;
      $('stopBtn').disabled = true;
      $('progress').value = 0;
      $('timeDisplay').textContent = '0:00 / ' + fmtTime(totalDur);
      if (progressRAF) { cancelAnimationFrame(progressRAF); progressRAF = null; }
      if (stopTimer) { clearTimeout(stopTimer); stopTimer = null; }
    }

    $('stopBtn').addEventListener('click', () => {
      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
      }
      stopPlayback();
    });

    function fmtTime(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    // ABC raw toggle
    abcToggle.addEventListener('click', () => {
      if (abcRaw.style.display === 'block') {
        abcRaw.style.display = 'none';
        abcToggle.innerHTML = '&#9660; Show raw ABC';
      } else {
        abcRaw.style.display = 'block';
        abcToggle.innerHTML = '&#9650; Hide raw ABC';
      }
    });
  </script>
</body>
</html>
